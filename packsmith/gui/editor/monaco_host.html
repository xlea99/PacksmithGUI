<!DOCTYPE html>
<!--
  The single Monaco instance that serves every Text Editor tab (design 4.2).

  One editor, many MODELS. A model is a lightweight buffer that owns its own content,
  undo history, cursor, and view state — switching tabs is `setModel`, which is why it
  costs ~4ms and loses nothing. The alternative (one editor per tab) was measured at a
  whole Chromium process and ~119MB per open file.

  Dirty state uses `getAlternativeVersionId()` rather than a boolean: undoing back to the
  saved state correctly reports clean again, which a flag gets wrong.
-->
<html>
<head>
<meta charset="utf-8">
<style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #1e1e1e; }
    #editor, #diff { width: 100%; height: 100%; }
    /* Two editors, one visible at a time. A diff editor is a different Monaco object from
       a normal one and cannot share its DOM node, so it gets its own — but it is still the
       same web view, which is the §4.2 promise: one Chromium process however many tabs. */
    #diff { display: none; }
    #loading { color: #666; font-family: monospace; padding: 20px; }
</style>
</head>
<body>
<div id="loading">Loading editor…</div>
<div id="editor"></div>
<div id="diff"></div>

<script src="qrc:///qtwebchannel/qwebchannel.js"></script>
<script src="./vendor/monaco/vs/loader.js"></script>
<!-- Pure text analysis for .star completions, in its own file so it can be unit
     tested outside a browser. See starlark_lang.js. -->
<script src="./starlark_lang.js"></script>
<!-- Monaco ships no JSON5; this registers one. Same reasoning as above — a wall of
     regex literals has no business being escaped through anything. -->
<script src="./json5_lang.js"></script>
<script>
    // Monaco is vendored (tools/vendor_monaco.py), so this page is fully offline. That
    // matters beyond convenience: a CDN dependency meant no internet = no editor at all,
    // and a frozen build betting on cdnjs serving one pinned version forever.
    //
    // The path has to be ABSOLUTE, resolved from this document rather than written down.
    // Relative paths work for the page but not for Monaco's web workers, which resolve
    // against the ORIGIN root — on file:// that's the drive root, so './vendor/...'
    // silently 404s and the editor comes up looking fine with its background services
    // dead. Deriving it from baseURI also means the frozen build needs no path handling:
    // wherever this file lands, vendor/ is beside it.
    const VS = new URL('./vendor/monaco/vs', document.baseURI).href;
    require.config({ paths: { vs: VS } });

    // Workers can't inherit the document's base, so hand them one that carries the
    // absolute path with it. This shim is Monaco's own documented recipe.
    window.MonacoEnvironment = {
        getWorkerUrl: function () {
            return URL.createObjectURL(new Blob([
                'self.MonacoEnvironment = { baseUrl: ' + JSON.stringify(VS + '/..') + ' };',
                'importScripts(' + JSON.stringify(VS + '/base/worker/workerMain.js') + ');'
            ], { type: 'text/javascript' }));
        }
    };

    let editor = null;
    const models = {};        // key -> { model, baseline, listener }
    let current = null;

    function bridgeCall(name, ...args) {
        if (window.bridge && window.bridge[name]) window.bridge[name](...args);
    }

    function initBridge(done) {
        if (window.qt && window.qt.webChannelTransport) {
            new QWebChannel(qt.webChannelTransport, function (channel) {
                window.bridge = channel.objects.bridge;
                done();
            });
        } else { done(); }
    }

    initBridge(function () {
        require(['vs/editor/editor.main'], function () {
            document.getElementById('loading').style.display = 'none';
            registerJson5();
            editor = monaco.editor.create(document.getElementById('editor'), {
                value: '', theme: 'vs-dark', automaticLayout: true,
                minimap: { enabled: true }, fontSize: 14, lineNumbers: 'on',
                scrollBeyondLastLine: false, cursorBlinking: 'smooth', smoothScrolling: true,
            });
            editor.addCommand(monaco.KeyMod.CtrlCmd | monaco.KeyCode.KeyS, function () {
                if (current) bridgeCall('saveRequested', current, models[current].model.getValue());
            });
            // The teaching moment: a file an action manages opens locked, and the instant
            // the user tries to type we ask whether they mean to take it. Cause and effect
            // land in the same second, instead of the job failing days later.
            if (typeof editor.onDidAttemptReadOnlyEdit === 'function') {
                editor.onDidAttemptReadOnlyEdit(function () {
                    if (current) bridgeCall('readOnlyEditAttempted', current);
                });
            }
            // Registered before the catalog arrives, deliberately: a provider reads
            // `starlarkApi` when it is *called*, so there is no ordering to get wrong
            // between this and Python's `setStarlarkApi`.
            registerStarlarkProviders();
            bridgeCall('editorReady');
        });
    });

    function reportDirty(key) {
        const entry = models[key];
        if (!entry) return;
        const dirty = entry.model.getAlternativeVersionId() !== entry.baseline;
        if (dirty !== entry.wasDirty) {
            entry.wasDirty = dirty;
            bridgeCall('dirtyChanged', key, dirty);
        }
    }

    // A model's URI is the only thing a language provider is given to identify the buffer
    // it was asked about. Without one Monaco assigns `inmemory://model/1`, so a completion
    // provider could not tell a `.star` action from an ordinary `.py` file — both open as
    // `python`, because Monaco ships no Starlark grammar. Keys are unique by construction
    // ("<source>:<path>"), so they make a sound URI once escaped.
    function modelUri(key) {
        return monaco.Uri.parse('packsmith:///' + encodeURIComponent(key));
    }

    function openModel(key, text, language, readOnly) {
        if (!editor) return false;
        if (!models[key]) {
            const model = monaco.editor.createModel(text, language || 'plaintext',
                                                    modelUri(key));
            const entry = { model: model, baseline: model.getAlternativeVersionId(),
                            wasDirty: false, readOnly: !!readOnly, viewState: null };
            models[key] = entry;
            model.onDidChangeContent(function () { reportDirty(key); });
        }
        showModel(key);
        return true;
    }

    function showModel(key) {
        if (!editor || !models[key]) return false;
        // Coming back from a diff: put the normal editor in front again.
        document.getElementById('diff').style.display = 'none';
        document.getElementById('editor').style.display = 'block';
        if (current && models[current]) models[current].viewState = editor.saveViewState();
        current = key;
        const entry = models[key];
        editor.setModel(entry.model);
        editor.updateOptions({ readOnly: entry.readOnly });
        if (entry.viewState) editor.restoreViewState(entry.viewState);
        editor.focus();
        return true;
    }

    function closeModel(key) {
        const entry = models[key];
        if (!entry) return false;
        if (current === key) { current = null; editor.setModel(null); }
        entry.model.dispose();
        delete models[key];
        return true;
    }

    // --- diffs (design 3.3's run report) ---------------------------------------------
    //
    // Created lazily: most sessions never open one, and a second Monaco editor costs
    // layout work at startup for nothing. Diff models are separate from `models` because
    // they are read-only pairs with no dirty state, no baseline and nothing to save —
    // filing them together would mean every save path had to ask which kind it had.

    let diffEditor = null;
    const diffs = {};          // key -> { original, modified }

    function ensureDiffEditor() {
        if (!diffEditor) {
            diffEditor = monaco.editor.createDiffEditor(document.getElementById('diff'), {
                theme: 'vs-dark', automaticLayout: true, readOnly: true,
                originalEditable: false, renderSideBySide: true,
                scrollBeyondLastLine: false, fontSize: 14,
            });
        }
        return diffEditor;
    }

    function openDiff(key, original, modified, language) {
        if (!monaco) return false;
        ensureDiffEditor();
        if (!diffs[key]) {
            diffs[key] = {
                original: monaco.editor.createModel(original, language || 'plaintext'),
                modified: monaco.editor.createModel(modified, language || 'plaintext'),
            };
        }
        showDiff(key);
        return true;
    }

    function showDiff(key) {
        const entry = diffs[key];
        if (!entry) return false;
        // The normal editor keeps its model — switching back is `showModel`, and losing
        // view state because you glanced at a diff would be its own small betrayal.
        document.getElementById('editor').style.display = 'none';
        document.getElementById('diff').style.display = 'block';
        ensureDiffEditor().setModel({ original: entry.original, modified: entry.modified });
        diffEditor.layout();
        return true;
    }

    function closeDiff(key) {
        const entry = diffs[key];
        if (!entry) return false;
        if (diffEditor) diffEditor.setModel(null);
        entry.original.dispose();
        entry.modified.dispose();
        delete diffs[key];
        return true;
    }

    function setReadOnly(key, flag) {
        const entry = models[key];
        if (!entry) return false;
        entry.readOnly = !!flag;
        if (current === key) editor.updateOptions({ readOnly: entry.readOnly });
        return true;
    }

    function valueOf(key) { return models[key] ? models[key].model.getValue() : null; }

    function markSaved(key) {
        const entry = models[key];
        if (!entry) return false;
        entry.baseline = entry.model.getAlternativeVersionId();
        reportDirty(key);
        return true;
    }

    function isDirty(key) {
        const entry = models[key];
        return entry ? entry.model.getAlternativeVersionId() !== entry.baseline : false;
    }

    function openKeys() { return Object.keys(models).join(','); }

    // --- the Packsmith action API (design 6.3's language services) --------------------
    //
    // Monaco has no Starlark grammar, so `.star` files are highlighted as Python and get
    // no completions of their own — the box is empty, and this fills it with the one thing
    // an action author actually needs: the `pack` capability object.
    //
    // The catalog is pushed once from Python (`gui/editor/starlark_api.catalog()`), where
    // it is INTROSPECTED from the real `Pack` rather than written down. Nothing here knows
    // any capability names; adding one to `pack.py` makes it appear with no edit to this
    // file. It is static because the `pack` surface is the same in every profile — no
    // round trip, no per-keystroke bridge traffic.

    let starlarkApi = null;            // providers stay silent until Python sends it

    function setStarlarkApi(payload) {
        starlarkApi = payload;
        return true;
    }

    // `pathIsStarlark`, `membersFor`, `memberAt` and `openCall` come from
    // ./starlark_lang.js — pure text analysis, kept out of this file so it can be unit
    // tested without a browser (tests/test_starlark_completions.py).
    function isStarlark(model) {
        if (!model || !model.uri) return false;
        try { return pathIsStarlark(decodeURIComponent(model.uri.path)); }
        catch (e) { return false; }
    }

    function lineBefore(model, position) {
        return model.getValueInRange({
            startLineNumber: position.lineNumber, startColumn: 1,
            endLineNumber: position.lineNumber, endColumn: position.column,
        });
    }

    function completionKind(member) {
        const K = monaco.languages.CompletionItemKind;
        if (member.kind === 'function') return K.Method;
        if (member.kind === 'namespace') return K.Module;
        return K.Property;
    }

    function registerStarlarkProviders() {
        monaco.languages.registerCompletionItemProvider('python', {
            triggerCharacters: ['.'],
            provideCompletionItems: function (model, position) {
                if (!isStarlark(model)) return { suggestions: [] };
                const members = membersFor(starlarkApi, lineBefore(model, position));
                if (!members) return { suggestions: [] };
                const word = model.getWordUntilPosition(position);
                const range = {
                    startLineNumber: position.lineNumber, endLineNumber: position.lineNumber,
                    startColumn: word.startColumn, endColumn: word.endColumn,
                };
                return {
                    suggestions: members.map(function (member) {
                        const isFn = member.kind === 'function';
                        const snippet = member.params.length
                            ? member.name + '($0)' : member.name + '()$0';
                        return {
                            label: member.name,
                            kind: completionKind(member),
                            detail: member.detail,
                            documentation: { value: member.doc || '' },
                            insertText: isFn ? snippet : member.name,
                            insertTextRules: isFn
                                ? monaco.languages.CompletionItemInsertTextRule.InsertAsSnippet
                                : undefined,
                            // Monaco's own word-based suggestions (every word in the buffer)
                            // are still on, and are useful elsewhere. Sorting ours ahead of
                            // them keeps `pack.` from being a lucky dip.
                            sortText: '0' + member.name,
                            range: range,
                        };
                    }),
                };
            },
        });

        monaco.languages.registerSignatureHelpProvider('python', {
            signatureHelpTriggerCharacters: ['(', ','],
            signatureHelpRetriggerCharacters: [',', ')'],
            provideSignatureHelp: function (model, position) {
                if (!isStarlark(model)) return null;
                const call = openCall(lineBefore(model, position));
                if (!call) return null;
                const member = memberAt(starlarkApi, call.before);
                if (!member || member.kind !== 'function') return null;
                return {
                    value: {
                        signatures: [{
                            label: member.name + member.detail,
                            documentation: { value: member.doc || '' },
                            parameters: member.params.map(function (p) {
                                return { label: p };
                            }),
                        }],
                        activeSignature: 0,
                        activeParameter: Math.min(call.argIndex,
                                                  Math.max(member.params.length - 1, 0)),
                    },
                    dispose: function () {},
                };
            },
        });

        monaco.languages.registerHoverProvider('python', {
            provideHover: function (model, position) {
                if (!isStarlark(model)) return null;
                const word = model.getWordAtPosition(position);
                if (!word) return null;
                const upto = model.getLineContent(position.lineNumber)
                                  .slice(0, word.endColumn - 1);
                const member = memberAt(starlarkApi, upto);
                if (!member) return null;
                const head = member.kind === 'function'
                    ? '```python\n' + member.name + member.detail + '\n```'
                    : '**' + member.name + '**'
                      + (member.detail ? ' — `' + member.detail + '`' : '');
                const body = member.doc ? '\n\n' + member.doc : '';
                return {
                    range: new monaco.Range(position.lineNumber, word.startColumn,
                                            position.lineNumber, word.endColumn),
                    contents: [{ value: head + body }],
                };
            },
        });
    }
</script>
</body>
</html>
