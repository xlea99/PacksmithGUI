<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #1e1e1e; }
    #editor { width: 100%; height: 100%; }
</style>
</head>
<body>
<div id="editor"></div>

<script src="qrc:///qtwebchannel/qwebchannel.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.52.2/min/vs/loader.min.js"></script>
<script>
    require.config({ paths: { vs: 'https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.52.2/min/vs' } });

    let editor = null;

    // Set up the bridge as soon as possible
    function initBridge(callback) {
        if (window.qt && window.qt.webChannelTransport) {
            new QWebChannel(qt.webChannelTransport, function(channel) {
                window.bridge = channel.objects.bridge;
                callback();
            });
        } else {
            callback();
        }
    }

    initBridge(function() {
        require(['vs/editor/editor.main'], function () {
            editor = monaco.editor.create(document.getElementById('editor'), {
                value: '',
                language: 'python',
                theme: 'vs-dark',
                automaticLayout: true,
                minimap: { enabled: true },
                fontSize: 14,
                lineNumbers: 'on',
                scrollBeyondLastLine: false,
                roundedSelection: false,
                renderWhitespace: 'none',
                cursorBlinking: 'smooth',
                smoothScrolling: true,
            });

            editor.onDidChangeModelContent(function() {
                if (window.bridge) {
                    window.bridge.contentChanged(editor.getValue());
                }
            });

            // Notify Python that Monaco is ready
            if (window.bridge) {
                window.bridge.editorReady();
            }
        });
    });

    // Called from Python to set editor content
    function setContent(text, language) {
        if (!editor) return;
        var model = editor.getModel();
        monaco.editor.setModelLanguage(model, language || 'python');
        editor.setValue(text);
    }

    // Called from Python to get editor content
    function getContent() {
        return editor ? editor.getValue() : '';
    }
</script>
</body>
</html>
